{% extends 'base.html' %}

{% block titulo %}Borrar Página{% endblock %}

{% block contenido %}
<div class="tarjeta">
    <h1>¿Borrar "{{ pagina.titulo }}"?</h1>
    <p>Esta acción no se puede deshacer.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-peligro">Sí, borrar</button>
        <a href="{% url 'lista_paginas' %}" class="btn btn-secundario">Cancelar</a>
    </form>
</div>
{% endblock %}
