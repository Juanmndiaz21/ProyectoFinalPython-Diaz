{% extends 'base.html' %}
{% load static %}

{% block titulo %}{{ accion }} Página{% endblock %}

{% block contenido %}
<div class="tarjeta">
    <h1>{{ accion }} Página</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ formulario.as_p }}
        <button type="submit" class="btn btn-primario">{{ accion }}</button>
        <a href="{% url 'lista_paginas' %}" class="btn btn-secundario">Cancelar</a>
    </form>
</div>
{% endblock %}
