{% extends 'base.html' %}

{% block titulo %}Cambiar Contraseña{% endblock %}

{% block contenido %}
<div class="tarjeta">
    <h1>Cambiar Contraseña</h1>
    <form method="post">
        {% csrf_token %}
        {{ formulario.as_p }}
        <button type="submit" class="btn btn-primario">Cambiar</button>
        <a href="{% url 'perfil' %}" class="btn btn-secundario">Cancelar</a>
    </form>
</div>
{% endblock %}
